[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.1.0"
description = "Explainable payment reconciliation with row-level evidence and SQLite audit history"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerlens*"]
